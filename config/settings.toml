url = "https://hn.algolia.com/api/v1/search_by_date"
authority = 2
options = { min_points = 50, window_hours = 24 }

# --- Repo watchlist (releases beat) --------------------------------------------------
# tag_pattern: a Python regex the release tag must fully match. Monorepos publish many
# packages from one repo, so the pattern picks the package we care about.

[[watchlist]]
owner = "langchain-ai"
repo = "langgraph"
pypi_package = "langgraph"
tag_pattern = '\d+\.\d+\.\d+'

[[watchlist]]
owner = "langchain-ai"
repo = "langchain"
pypi_package = "langchain-core"
tag_pattern = 'langchain(-core)?==\d+\.\d+\.\d+'

[[watchlist]]
owner = "langchain-ai"
repo = "langchain-mcp-adapters"
pypi_package = "langchain-mcp-adapters"
tag_pattern = 'langchain-mcp-adapters==\d+\.\d+\.\d+'

[[watchlist]]
owner = "langchain-ai"
repo = "langsmith-sdk"
pypi_package = "langsmith"
tag_pattern = 'v\d+\.\d+\.\d+'

[[watchlist]]
owner = "modelcontextprotocol"
repo = "python-sdk"
pypi_package = "mcp"
tag_pattern = 'v\d+\.\d+\.\d+'

[[watchlist]]
