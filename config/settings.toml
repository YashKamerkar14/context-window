# Context Window settings: what the newsroom reads and what the reader cares about.
# Load into the database with `cw settings load`. This file is the source of truth:
# sources and repos removed here are disabled, interests removed here are deleted.
#
# Every feed and repo below was checked live on 2026-10-08. Anthropic, Meta AI and
# Mistral publish no RSS feed, so the industry beat cannot follow their blogs yet.

# --- Research ------------------------------------------------------------------------

[[sources]]
name = "Hugging Face daily papers"
beat = "research"
kind = "hf_papers"
url = "https://huggingface.co/api/daily_papers"
authority = 3

[[sources]]
name = "arXiv"
beat = "research"
kind = "arxiv"
url = "https://export.arxiv.org/api/query"
authority = 3
# arXiv asks for at most one request every 3 seconds.
options = { categories = ["cs.AI", "cs.CL", "cs.LG"], min_interval_seconds = 3 }

# --- Releases ------------------------------------------------------------------------

[[sources]]
name = "GitHub Releases"
beat = "releases"
kind = "github_releases"
url = "https://api.github.com/"
authority = 5

[[sources]]
name = "PyPI releases"
beat = "releases"
kind = "pypi_releases"
url = "https://pypi.org/rss/project/"
authority = 4
options = { feed_template = "https://pypi.org/rss/project/{package}/releases.xml" }

