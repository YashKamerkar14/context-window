# --- Interests -----------------------------------------------------------------------
# `description` is the text that gets embedded for ranking; make it specific.

[[interests]]
topic = "Agent frameworks"
description = "Frameworks and patterns for building LLM agents: LangGraph, multi-agent orchestration, tool calling, planning, memory and durable execution."

[[interests]]
topic = "Evaluation"
description = "Evaluating LLM applications and agents: benchmarks, LLM-as-judge, eval datasets, regression testing, tracing and observability."

[[interests]]
topic = "MCP"
description = "The Model Context Protocol: MCP servers and clients, SDKs, tool integration and the protocol specification."

[[interests]]
topic = "Retrieval"
description = "Retrieval-augmented generation: embeddings, vector databases, rerankers, chunking, hybrid search and long-context retrieval."

[[interests]]
topic = "Model releases"
description = "New and updated foundation models from AI labs: capabilities, context windows, pricing, open weights and API changes."
