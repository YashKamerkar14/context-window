<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Context Window newsroom pipeline</title>
  <desc id="desc">An editor briefs four reporters (releases, research, industry, community). Their stories go to the desk, which merges and ranks them, then to the fact desk, which checks every claim against its source. The writer drafts the briefing, a copy check reviews it, a review gate approves it, and it is published to the web and email and archived.</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#21262d"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .label { fill: #8b949e; font-size: 13px; letter-spacing: 1.5px; }
      .title { fill: #e6edf3; font-size: 15px; font-weight: 700; }
      .line { fill: #8b949e; font-size: 12px; }
      .pill { fill: #e6edf3; font-size: 13px; }
      .muted { fill: #6e7681; font-size: 11px; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .wire { fill: none; stroke: #30363d; stroke-width: 1.6; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .flow { display: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="398" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="12" y="12" width="976" height="376" rx="10" fill="url(#grid)"/>
  <text x="34" y="46" class="mono label">ARCHITECTURE : CONTEXT WINDOW NEWSROOM</text>

  <!-- wires -->
  <path id="w-e1" class="wire" d="M180 150 C 205 150, 200 95, 225 95"/>
  <path id="w-e2" class="wire" d="M180 150 C 205 150, 200 133, 225 133"/>
  <path id="w-e3" class="wire" d="M180 150 C 205 150, 200 171, 225 171"/>
  <path id="w-e4" class="wire" d="M180 150 C 205 150, 200 209, 225 209"/>
  <path id="w-r1" class="wire" d="M425 95 C 455 95, 450 150, 480 150"/>
  <path id="w-r2" class="wire" d="M425 133 C 455 133, 450 150, 480 150"/>
  <path id="w-r3" class="wire" d="M425 171 C 455 171, 450 150, 480 150"/>
  <path id="w-r4" class="wire" d="M425 209 C 455 209, 450 150, 480 150"/>
  <path id="w-df" class="wire" d="M640 150 L 690 150"/>
  <path id="w-fw" class="wire" d="M895 222 L 895 270"/>
  <path id="w-wc" class="wire" d="M820 298 L 790 298"/>
  <path id="w-cr" class="wire" d="M640 298 L 610 298"/>
  <path id="w-rp" class="wire" d="M460 298 L 430 298"/>
  <path id="w-pa" class="wire" d="M280 298 L 250 298"/>

  <!-- editor -->
  <rect x="30" y="100" width="150" height="100" rx="8" class="box"/>
  <text x="46" y="128" class="mono title">Editor</text>
  <text x="46" y="153" class="mono line">· plans coverage</text>
  <text x="46" y="173" class="mono line">· briefs 4 beats</text>

  <!-- reporters -->
  <g class="mono">
    <rect x="225" y="80" width="200" height="30" rx="6" class="box"/>
    <text x="238" y="100" class="pill">releases</text><text x="318" y="100" class="muted">github·pypi</text>
    <circle cx="410" cy="95" r="4" fill="#58a6ff" class="pulse"/>
    <rect x="225" y="118" width="200" height="30" rx="6" class="box"/>
    <text x="238" y="138" class="pill">research</text><text x="318" y="138" class="muted">arxiv·hf</text>
    <circle cx="410" cy="133" r="4" fill="#bc8cff" class="pulse" style="animation-delay:.4s"/>
    <rect x="225" y="156" width="200" height="30" rx="6" class="box"/>
    <text x="238" y="176" class="pill">industry</text><text x="318" y="176" class="muted">lab blogs</text>
    <circle cx="410" cy="171" r="4" fill="#d29922" class="pulse" style="animation-delay:.8s"/>
    <rect x="225" y="194" width="200" height="30" rx="6" class="box"/>
    <text x="238" y="214" class="pill">community</text><text x="318" y="214" class="muted">hacker news</text>
    <circle cx="410" cy="209" r="4" fill="#3fb950" class="pulse" style="animation-delay:1.2s"/>
  </g>

  <!-- desk -->
  <rect x="480" y="95" width="160" height="110" rx="8" class="box"/>
  <text x="496" y="123" class="mono title">Desk</text>
  <text x="496" y="148" class="mono line">· merge (pgvector)</text>
  <text x="496" y="168" class="mono line">· rank by interest</text>
  <text x="496" y="188" class="mono line">· 14-day memory</text>

  <!-- fact desk (the centre of gravity) -->
  <rect x="690" y="78" width="280" height="144" rx="10" fill="#1c1a14" stroke="#e3a14b" stroke-width="2"/>
  <text x="708" y="106" class="mono title" style="fill:#e3a14b">Fact Desk</text>
  <text x="708" y="131" class="mono line">· every claim vs. its source</text>
  <text x="708" y="151" class="mono line">· a quoted line of evidence</text>
  <text x="708" y="171" class="mono line">· rewrite or drop on failure</text>
  <text x="708" y="199" class="mono line" style="fill:#3fb950">✓ only supported claims print</text>
  <circle cx="665" cy="150" r="5" fill="#3fb950" class="pulse"/>

  <!-- bottom row, right to left -->
  <g class="mono">
    <rect x="820" y="270" width="150" height="56" rx="8" class="box"/>
    <text x="836" y="293" class="title" style="font-size:14px">Writer</text>
    <text x="836" y="313" class="line">intro from verified</text>
    <rect x="640" y="270" width="150" height="56" rx="8" class="box"/>
    <text x="656" y="293" class="title" style="font-size:14px">Copy check</text>
    <text x="656" y="313" class="line">nothing unsupported</text>
    <rect x="460" y="270" width="150" height="56" rx="8" class="box"/>
    <text x="476" y="293" class="title" style="font-size:14px">Review gate</text>
    <text x="476" y="313" class="line">human or auto</text>
    <rect x="280" y="270" width="150" height="56" rx="8" fill="#12261a" stroke="#3fb950" stroke-width="1.5"/>
    <text x="296" y="293" class="title" style="font-size:14px;fill:#3fb950">Publish</text>
    <text x="296" y="313" class="line">web · email</text>
    <rect x="100" y="270" width="150" height="56" rx="8" class="box"/>
    <text x="116" y="293" class="title" style="font-size:14px">Archive</text>
    <text x="116" y="313" class="line">memory for tomorrow</text>
  </g>

  <!-- work moving along the wires -->
  <g class="flow">
    <circle r="3.5" fill="#58a6ff"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#w-r1"/></animateMotion></circle>
    <circle r="3.5" fill="#bc8cff"><animateMotion dur="2.6s" begin="0.6s" repeatCount="indefinite"><mpath href="#w-r2"/></animateMotion></circle>
    <circle r="3.5" fill="#d29922"><animateMotion dur="2.6s" begin="1.2s" repeatCount="indefinite"><mpath href="#w-r3"/></animateMotion></circle>
    <circle r="3.5" fill="#3fb950"><animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#w-r4"/></animateMotion></circle>
    <circle r="3.5" fill="#e3a14b"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#w-fw"/></animateMotion></circle>
    <circle r="3.5" fill="#3fb950"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#w-rp"/></animateMotion></circle>
  </g>

  <text x="34" y="370" class="mono muted" style="letter-spacing:1px">STATUS : 11 AGENTS · CHECKPOINTED IN POSTGRES · 98% FACT-CHECK AGREEMENT · ~$0.03 A RUN</text>
</svg>
