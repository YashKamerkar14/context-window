[project]
name = "context-window"
version = "0.1.0"
description = "Context Window: a multi-agent AI newsroom"
authors = [
    { name = "YashKamerkar14", email = "yashkamerkar14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.4",
]

[project.scripts]
cw = "context_window.cli:main"

# Vercel deploys the FastAPI app from this module (Vercel project root: apps/api)
[tool.vercel]
entrypoint = "src.context_window.api.app:app"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs real network access; excluded from CI"]
addopts = "-m 'not live'"
