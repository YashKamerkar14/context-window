name: Newsroom

# The daily newsroom run, and manual runs and resumes (PLAN.md 2).
# - Every morning, Vercel Cron calls the API's GET /cron/daily-run between 13:00 and 14:00
#   UTC (06:00-07:00 Pacific in summer, 05:00-06:00 in winter), which dispatches this
#   workflow with trigger=schedule. GitHub's own schedule below is only a backup: on this
#   repository it fires about six hours late, and finds the day done.
# - "Run workflow" button: run today's newsroom, or resume a run by id.
# A cancelled or crashed job leaves its run resumable: the next run or resume picks it up.
on:
  schedule:
    # Backup only (see above). An odd minute, since jobs at the top of the hour start later.
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "run: today's newsroom. resume: continue the run below."
        type: choice
        options: [run, resume]
        default: run
      run_id:
        description: "Run id to resume (resume only)"
        type: string
        required: false
      force:
        description: "Run even if today's briefing is already published"
        type: boolean
        default: false
      resend:
        description: "Email the briefing even if it was emailed before"
        type: boolean
        default: false
      review_mode:
        description: "auto publishes at once; manual pauses for a review decision"
        type: choice
        options: [auto, manual]
        default: auto
      trigger:
        description: "schedule when started by the daily timer (Vercel Cron)"
        type: choice
        options: [manual, schedule]
        default: manual

# One newsroom job at a time; a second one waits instead of cancelling the first.
concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  newsroom:
    name: Newsroom
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/api
    env:
      # Secrets: Settings > Secrets and variables > Actions.
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BRIEFING_EMAIL_TO: ${{ secrets.BRIEFING_EMAIL }}
      # The job's own token: enough for reading public GitHub releases.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publishing refreshes the web app at once (POST /api/revalidate).
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      WEB_ORIGIN: https://context-window-gamma.vercel.app
      # Configuration (not secret).
      MODEL_PROVIDER: openrouter
      MODEL_FAST: anthropic/claude-haiku-5.5
      MODEL_STRONG: anthropic/claude-haiku-5.5
      MODEL_PRICES: '{"anthropic/claude-haiku-5.5": {"in": 0.10, "out": 0.50}, "openai/text-embedding-3-small": {"in": 0.02, "out": 0}}'
      EMBEDDING_PROVIDER: openrouter
      EMBEDDING_MODEL: openai/text-embedding-3-small
      LANGSMITH_PROJECT: context-window
      LANGGRAPH_STRICT_MSGPACK: "true"
      BRIEFING_TZ: America/Los_Angeles
      # Scheduled runs review automatically; a manual run may ask to pause for review.
      REVIEW_MODE: ${{ inputs.review_mode || 'auto' }}
      RESEND_FROM: "Context Window <onboarding@resend.dev>"
      ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      # Both are idempotent: migrations to the latest version, then the settings file.
      - name: Prepare the database
        run: |
          uv run cw db init
          uv run cw settings load
      - name: Run the newsroom
        if: github.event_name == 'schedule' || inputs.command == 'run'
        env:
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger || 'manual' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          RESEND: ${{ inputs.resend && '--resend' || '' }}
        run: uv run cw run --trigger "$TRIGGER" $FORCE $RESEND
      - name: Resume a run
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'resume'
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: uv run cw resume "$RUN_ID"
