# Local Postgres with pgvector. Production uses Neon.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: cw
      POSTGRES_PASSWORD: cw
      POSTGRES_DB: context_window
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cw -d context_window"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
