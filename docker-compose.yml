# Local Postgres with pgvector, matching Neon (Postgres 18). Optional: development uses a Neon dev branch.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: cw
      POSTGRES_PASSWORD: cw
      POSTGRES_DB: context_window
    ports:
      - "5433:5432"  # 5433 on the host so it never clashes with a local Postgres
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<version>, so mount the parent
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cw -d context_window"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
